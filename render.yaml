services:
  - type: web
    name: utsavly-backend
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: AI_MOCK
        value: "true"
      - key: PYTHONPATH
        value: ".."
      - key: ALLOWED_ORIGINS
        value: "http://localhost:5173,https://utsavly.vercel.app"
      - key: GEMINI_API_KEY
        sync: false
